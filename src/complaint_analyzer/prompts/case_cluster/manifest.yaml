prompt_set: case_cluster
description: >-
  Groups a batch of summarized Nurse Call cases into clusters of similar meaning and intent, with
  labelled sub-clusters that cite CaseNumbers. A Nurse Call glossary is injected via {{GLOSSARY}}
  from glossary.md.
created: "2026-10-19"
updated: "2026-10-19"
versions:
