prompt_set: case_summary
description: >-
  Concise structured summary of a single complaint / service case: what was reported,
  which product, actions taken, resolution and status, plus key points.
created: "2026-10-16"
updated: "2026-10-20"
versions:
  - version: v1
    file: v1.txt
    created: "2026-10-16"
    author: copilot
    base_version: null
    prompt: >-
      Add a "case_summary" prompt alongside root cause analysis, tracked with versions,
      a manifest and a changelog like the query sets.
    summary: Initial case summary prompt with JSON-only output.
    changes:
      - Initial version.
    result_model: CaseSummaryResult
    validation:
      status: skipped
      notes: Not yet run against records.
  - version: v2
    file: v2.txt
    created: "2026-10-19"
    author: Copilot (prompt-author)
    base_version: v1
    prompt: >-
      Summarize the cases from the October 2026 Nurse Call CQ fetch in batches of 20. Create a
      new prompt version that engineers the context format: use the fields CaseNumber, Subject,
      HRCSVC_Case_Resolution__c, HRCSVC_Product_Group__c, RA_Issue_Cause__c,
      RA_Actions_to_Resolve_Text__c, RA_Did_same_issue_occur__c,
      RA_Test_Inspection_Troubleshooting__c and RA_Test_Results__c for each case, and preface
      each field's contents with the Excel column name and a ":".
    summary: Context-format prompt for cases rendered as column-name and value lines.
    changes:
      - Describes the single Case Context block, its column-name and value lines, and multi-line values.
      - Explains each of the nine context columns.
      - Same JSON output and result model as v1.
      - Adds key point guidance for repeat failures and a rule not to copy people's names.
    result_model: CaseSummaryResult
    validation:
      status: skipped
      notes: Not yet run against records.
  - version: v3
    file: v3.txt
    created: "2026-10-20"
    author: Copilot (prompt-author)
    base_version: v2
    prompt: >-
      Revise the case_summary prompt to include use of the Description field when generating
      summaries.
    summary: Adds the Description field to the context columns and tells the model how to use it.
    changes:
      - Adds Description to the list of context columns, described as the reporter's free-text case description.
      - Adds guidance to use Description with Subject for what was reported, product, symptoms, error messages and versions.
      - Prefers the RA_* and resolution fields over Description for cause, actions and resolution, and notes disagreements in key_points.
      - Forbids copying contact details or names of people or patients from Description.
      - Same JSON output and result model as v2.
    result_model: CaseSummaryResult
    validation:
      status: skipped
      notes: Not yet run against records.
