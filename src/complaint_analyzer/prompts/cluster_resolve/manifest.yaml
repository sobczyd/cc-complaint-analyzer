prompt_set: cluster_resolve
description: >-
  Resolves the sub-clusters of a later time period (B) onto the baseline taxonomy of an earlier period
  (A) so the two periods can be compared like for like. Each period B sub-cluster is matched to a baseline
  sub-cluster or flagged as new with a proposed label. Uses the same glossary as case_cluster.
created: "2026-10-20"
updated: "2026-10-20"
versions:
  - version: v1
    file: v1.txt
    created: "2026-10-20"
    author: Copilot (prompt-author)
    base_version: null
    prompt: >-
      Add a skill that compares two time frames (for example September and October 2026). Clusters from
      the two periods will have slightly different names, so add a resolve step that maps the clusters of
      the second period onto the first period as a baseline, flagging groups that are new. Work at
      sub-cluster level and roll up to clusters; batch the later period's sub-clusters.
    summary: Maps each period B sub-cluster to a baseline (period A) sub-cluster or flags it as new.
    changes:
      - Initial version.
    result_model: ResolveResult
    validation:
      status: skipped
      notes: Not yet run against clusters.
