[project]
name = "cc-complaint-analyzer"
version = "0.1.0"
description = "LLM analysis of service-record workbooks with saved call history, logging, selection, and rate limiting."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
complaint-analyzer = "complaint_analyzer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/complaint_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:complaint_analyzer.*"]
